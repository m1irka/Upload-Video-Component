<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Video Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="upload-card">
    <div class="preview-box">
      <span class="sync-symbol">&#x21bb;</span>
    </div>
    <div class="info-box">
      <div class="progress-container">
        <div class="progress-bar-fill">
          <span>UPLOADING 40%</span>
        </div>
        <div class="progress-remaining">
          <span>About 23 minutes remaining</span>
        </div>
      </div>
      <h3 class="video-title">Title of video</h3>
      <p class="status-note">* Your video is still uploading. Please keep this page open until it's done.</p>
    </div>
    <div class="action-box">
      <button type="button" class="btn-done">DONE</button>
    </div>
  </div>
</body>
</html>
